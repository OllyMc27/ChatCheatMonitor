name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ChatCheatMonitor.slnx

      - name: Build
        run: dotnet build ChatCheatMonitor.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project ChatCheatMonitor.Tests/ChatCheatMonitor.Tests.csproj --configuration Release --no-build
